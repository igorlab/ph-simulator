; Калібратор pH (імітатор електрода): ESP32-C3 SuperMini + ADS1115 + OLED SSD1306.
; Налаштування конкретного комп'ютера (порт тощо) — у platformio_local.ini, його немає в git.

[platformio]
extra_configs = platformio_local*.ini

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; USB CDC на старті — Serial на C3 іде через вбудований USB
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

; Wire і Preferences — бібліотеки ядра, окремо не вказуються.
; Асинхронний веб-сервер працює у власному таску AsyncTCP, тож HTTP не заважає вимірам.
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    olikraus/U8g2
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

; pH electrode simulator and leakage tester: ESP32-C3 SuperMini + ADS1115 + SSD1306 OLED.
;
; Every version is pinned exactly: the platform (and with it the Arduino core, ESP-IDF and
; the compiler) and each library. A floating version quietly changes the code that gets
; built, and a year later the project no longer builds for whoever repeats it.
;
; No upload port here: PlatformIO finds the board by itself. With several boards plugged
; in, see README, «Port»: put your port in platformio_local.ini (not in git), which the
; extra_configs line below picks up.

[platformio]
default_envs = esp32-c3-devkitm-1
; Optional local file (port etc.). The «*» pattern does not fail when the file is absent.
extra_configs = platformio_local*.ini

[env:esp32-c3-devkitm-1]
; pioarduino 55.03.312-1 = Arduino core 3.3.12, ESP-IDF 5.5.5, GCC 14.2.
; The official platformio/espressif32 still ships only the old core 2.0.17.
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; USB CDC on boot, for Serial on the C3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0            ; no [E] i2c... spam on the monitor

; The async web server runs in its own AsyncTCP task, so HTTP and I2C never hold
; each other up. Adafruit BusIO is a dependency of ADS1X15, pinned as well.
lib_deps =
    adafruit/Adafruit ADS1X15 @ 2.6.2
    adafruit/Adafruit BusIO @ 1.17.4
    olikraus/U8g2 @ 2.36.18
    esp32async/AsyncTCP @ 3.5.0
    esp32async/ESPAsyncWebServer @ 3.12.1
